name: Deploy FGV-PETEJ-SC dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        shell: Rscript {0}
        run: |
          install.packages("shinylive", repos = "https://cloud.r-project.org")

      - name: Check dashboard data
        shell: bash
        run: |
          test -f app/data/report.csv || \
            (echo "ERROR: app/data/report.csv is missing" && exit 1)

      - name: Export Shinylive site
        shell: Rscript {0}
        run: |
          shinylive::export(
            appdir = "app",
            destdir = "site",
            wasm_packages = TRUE,
            template_params = list(title = "FGV-PETEJ-SC")
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
